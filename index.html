  body {

    min-height: 100dvh; height: 100dvh; height: 100vh;

    line-height: 0.88;
    font-variant-numeric: tabular-nums;
    font-feature-settings: "tnum";
  }

  .week-chart .c-lo-line { stroke: var(--lo); }

  .week-chart .c-lo-dot { fill: var(--lo); }

    const bot = t >= 30 ? "短裤" : (t < 0 ? "加绒裤" : "长裤");
    const parts = [top, bot];
    if (m.pop >= 40) parts.push("带伞");
    else if (m.pop >= 20 || isRainCode(m.code)) parts.push("备伞");
    if (t < 0) parts.push("帽手套");
    return parts.join(" · ");
  }
  function renderOutfit(d) {

  function overnightMin(d) {
    const today = dailyAt(ymd(d));
    if (hourNum(d) >= 18) {
      const tm = dailyAt(addDays(ymd(d), 1));
      if (tm && tm.min != null) return tm.min;
    }
    return today && today.min;
  }
  function homeClimateLine(d) {
    if (!weather || !weather.current) return "";
    const out = weather.current.temperature_2m;
    const rh = weather.current.relative_humidity_2m;
    const low = overnightMin(d);
    const night = isNight(d);
    const floor = Math.min(out, low != null ? low : out);
    const cold = floor <= 11;
    const veryCold = floor < 5;
    let ac = "空调 关";
    if (out >= 28) ac = "空调 制冷";
    else if (cold) ac = "空调 制热";
    const oil = (night && cold) || veryCold;
    let room = "室温 22–24℃";
    if (ac === "空调 制冷") room = "室温 26℃";
    else if (ac === "空调 制热" || out < 15) room = "室温 20–22℃";
    let hum = "湿度 40–60%";
    if (rh != null) {
      if (ac === "空调 制热") {
        if (rh < 50) hum += " · 加湿";
        else if (rh >= 85) hum += " · 除湿";
      } else if (rh < 40) hum += " · 加湿";
      else if (rh > 70) hum += " · 除湿";
    }
    const devices = oil ? (ac + " · 油汀 卧室") : ac;
    return { devices: devices, env: room + " · " + hum, text: devices + " · " + room + " · " + hum };
  }
  function renderHomeClimate(d) {
    const el = document.getElementById("home-row");
    if (!el) return;
    const line = homeClimateLine(d);
    if (!line) { el.innerHTML = ""; return; }
    el.innerHTML = '<span class="who">居家</span><span class="kw"><span class="home-a">' +
      line.devices + '</span><span class="home-b">' + line.env + "</span></span>";
  }


  function commuteWindow(isoDate) {
    const hrs = hoursInRange(isoDate, 5, 8);
    if (!hrs.length) return null;
    const temps = hrs.map((x) => x.temp);
    const pops = hrs.map((x) => x.pop);
    const codes = hrs.map((x) => x.code);
    return {
      min: Math.min.apply(null, temps),
      max: Math.max.apply(null, temps),
      pop: Math.max.apply(null, pops),
      rain: codes.some(isRainCode),
      fog: codes.some(isFogCode),
      ice: codes.some(isIceCode) || Math.min.apply(null, temps) <= 0
    };
  }
  function buildTips(d) {
    const tips = [];
    if (!weather) return tips;
    const f = focusDay(d);
    const day = dailyAt(f.date);
    const cur = weather.current;
    const tomWi = (function () {
      const [y, m, dd] = f.tomorrow.split("-").map(Number);
      return new Date(Date.UTC(y, m - 1, dd)).getUTCDay();
    })();
    if (day && (day.min <= 0 || isIceCode(day.code))) tips.push({ icon: "ice", text: "结冰" });
    if (cur && (cur.precipitation > 0 || isRainCode(cur.weather_code))) tips.push({ icon: "rain", text: "湿滑" });
    else if (day && (day.pop >= 40 || (isRainCode(day.code) && day.pop >= 20))) tips.push({ icon: "umbrella", text: "带伞" });
    if (isFogCode(day && day.code) || (cur && isFogCode(cur.weather_code))) tips.push({ icon: "fog", text: "有雾" });
    if (air && air.current && air.current.us_aqi >= 101) tips.push({ icon: "mask", text: "戴口罩" });
    if (day && day.uv >= 6) tips.push({ icon: "sun", text: "防晒" });
    if (cur && cur.wind_speed_10m >= 25) tips.push({ icon: "wind", text: "大风" });
    if (day && day.max - day.min >= 8) tips.push({ icon: "thermometer", text: "温差大" });
    if (tomWi >= 1 && tomWi <= 5) {
      const c = commuteWindow(f.tomorrow);
      if (c) {
        if (c.ice) tips.push({ icon: "ice", text: "通勤结冰" });
        else if (c.pop >= 40 || c.rain) tips.push({ icon: "car", text: "通勤湿滑" });
        else if (c.fog) tips.push({ icon: "car", text: "通勤有雾" });
        else tips.push({ icon: "car", text: "通勤 " + round0(c.min) + "–" + round0(c.max) + "°" });
      }
    }
    /* de-dupe by text, cap at 2 */
    const seen = {};
    const out = [];
    for (const tip of tips) {
      if (seen[tip.text]) continue;
      seen[tip.text] = 1;
      out.push(tip);
      if (out.length === 2) break;
    }
    return out;
  }
  function renderTips(d) {
    const el = document.getElementById("tips-list");
    const tips = buildTips(d);
    el.innerHTML = tips.map((t) =>

  function smoothPath(pts, tension) {
    if (pts.length < 2) return "";
    const t = tension == null ? 0.18 : tension;
    let d = "M " + pts[0][0] + " " + pts[0][1];
    for (let i = 0; i < pts.length - 1; i++) {
      const p0 = pts[Math.max(0, i - 1)];
      const p1 = pts[i];
      const p2 = pts[i + 1];
      const p3 = pts[Math.min(pts.length - 1, i + 2)];
      const cp1x = p1[0] + (p2[0] - p0[0]) * t;
      const cp1y = p1[1] + (p2[1] - p0[1]) * t;
      const cp2x = p2[0] - (p3[0] - p1[0]) * t;
      const cp2y = p2[1] - (p3[1] - p1[1]) * t;
      d += " C " + cp1x.toFixed(1) + "," + cp1y.toFixed(1) + " " + cp2x.toFixed(1) + "," + cp2y.toFixed(1) + " " + p2[0].toFixed(1) + "," + p2[1].toFixed(1);
    }
    return d;
  }

  function appleDayLabel(iso, todayIso) {
    if (iso === todayIso) return "今天";
    const [y, m, dd] = iso.split("-").map(Number);
    return "周" + CN_DAY[new Date(Date.UTC(y, m - 1, dd)).getUTCDay()];
  }
  function renderWeekRow(d) {
    const el = document.getElementById("daily-row");
    if (!el || !weather) { if (el) el.innerHTML = ""; return; }
    const todayIso = ymd(d);
    const n = Math.min(7, weather.daily.time.length);
    const days = [];
    for (let i = 0; i < n; i++) {
      days.push({
        date: weather.daily.time[i],
        max: weather.daily.temperature_2m_max[i],
        min: weather.daily.temperature_2m_min[i],
        code: weather.daily.weather_code[i],
        label: appleDayLabel(weather.daily.time[i], todayIso)
      });
    }
    const W = 660, H = 320;
    const padL = 30, padR = 30, padT = 30, padB = 56;
    const mins = days.map((x) => x.min), maxs = days.map((x) => x.max);
    let tMin = Math.floor(Math.min.apply(null, mins) - 1);
    let tMax = Math.ceil(Math.max.apply(null, maxs) + 1);
    if (tMax - tMin < 10) {
      const mid = (tMax + tMin) / 2;
      tMin = mid - 5;
      tMax = mid + 5;
    }
    const xAt = (i) => padL + (i + 0.5) * ((W - padL - padR) / n);
    const yT = (t) => padT + (1 - (t - tMin) / (tMax - tMin || 1)) * (H - padT - padB);
    const hiPts = days.map((day, i) => [xAt(i), yT(day.max)]);
    const loPts = days.map((day, i) => [xAt(i), yT(day.min)]);
    const hi = smoothPath(hiPts, 0.2);
    const lo = smoothPath(loPts, 0.2);
    const closed = hi + " " + smoothPath(loPts.slice().reverse(), 0.2).replace(/^M /, "L ") + " Z";
    let marks = "";
    days.forEach((day, i) => {
      const x = xAt(i);
      const y1 = yT(day.max), y2 = yT(day.min);
      marks += '<text class="c-hi" x="' + x.toFixed(1) + '" y="' + (y1 - 12).toFixed(1) + '" text-anchor="middle">' + round0(day.max) + "°</text>";
      marks += '<text class="c-lo" x="' + x.toFixed(1) + '" y="' + (y2 + 18).toFixed(1) + '" text-anchor="middle">' + round0(day.min) + "°</text>";
      marks += '<circle class="c-hi-dot" cx="' + x.toFixed(1) + '" cy="' + y1.toFixed(1) + '" r="4"></circle>';
      marks += '<circle class="c-lo-dot" cx="' + x.toFixed(1) + '" cy="' + y2.toFixed(1) + '" r="4"></circle>';
      marks += iconGroup(iconName(day.code, false), x, H - 32, 18);
      marks += '<text class="c-wk" x="' + x.toFixed(1) + '" y="' + (H - 8) + '" text-anchor="middle">' + day.label + "</text>";
    });
    el.innerHTML = '<svg class="week-chart" viewBox="0 0 ' + W + " " + H + '" preserveAspectRatio="xMidYMid meet" role="img" aria-label="未来一周最高最低气温">' +
      '<defs><linearGradient id="wkBand" x1="0" y1="0" x2="0" y2="1">' +
      '<stop offset="0%" class="c-band-top"></stop><stop offset="100%" class="c-band-bot"></stop></linearGradient></defs>' +
      '<path class="c-band" d="' + closed + '" fill="url(#wkBand)"></path>' +
      '<path class="c-hi-line" d="' + hi + '" fill="none"></path>' +
      '<path class="c-lo-line" d="' + lo + '" fill="none"></path>' +
      marks + "</svg>";
  }

  
  function drawHourlyChart(d) {
    const hours = hourlyFrom(currentHourStamp(d), 48);
    const el = document.getElementById("hourly-chart");
    if (hours.length < 4) { el.innerHTML = ""; return; }
    const W = 640, H = 200;
    const padL = 36, padR = 14, padT = 18, padB = 28;
    const temps = hours.map((x) => x.temp);
    const tMin = Math.floor(Math.min.apply(null, temps) - 1);
    const tMax = Math.ceil(Math.max.apply(null, temps) + 1);
    const n = hours.length;
    const xAt = (i) => padL + (i / (n - 1)) * (W - padL - padR);
    const yT = (t) => padT + (1 - (t - tMin) / (tMax - tMin || 1)) * (H - padT - padB);
    const barW = Math.max(2.2, (W - padL - padR) / n * 0.5);
    let bars = "";
    hours.forEach((h, i) => {
      const bh = (h.pop / 100) * (H - padT - padB) * 0.82;
      const x = xAt(i) - barW / 2;
      const y = H - padB - bh;
      const a = 0.18 + 0.5 * (h.pop / 100);
      bars += '<rect x="' + x.toFixed(1) + '" y="' + y.toFixed(1) + '" width="' + barW.toFixed(1) + '" height="' + Math.max(0, bh).toFixed(1) + '" rx="1.6" fill="rgba(159,212,255,' + a.toFixed(2) + ')" />';
    });
    const pts = hours.map((h, i) => [xAt(i), yT(h.temp)]);
    const line = smoothPath(pts);
    const area = line + " L " + pts[pts.length - 1][0].toFixed(1) + " " + (H - padB) + " L " + pts[0][0].toFixed(1) + " " + (H - padB) + " Z";
    let labels = "";
    const todayIso = ymd(d);
    hours.forEach((h, i) => {
      if (i % 6 !== 0 && i !== 0) return;
      let lab = h.hour + "时";
      if (h.date !== todayIso && h.hour === 0) lab = weekLabel(h.date, todayIso);
      else if (h.date !== todayIso) lab = weekLabel(h.date, todayIso) + " " + h.hour + "时";
      const anchor = (i === 0) ? "start" : "middle";
      const x = i === 0 ? (xAt(i) + 2) : xAt(i);
      labels += '<text x="' + x.toFixed(1) + '" y="' + (H - 8) + '" text-anchor="' + anchor + '" fill="rgba(255,255,255,0.62)" font-size="11" font-family="-apple-system,PingFang SC,sans-serif">' + lab + "</text>";
    });
    const yLabs = [tMin, Math.round((tMin + tMax) / 2), tMax].map((t) =>
      '<text x="' + (padL - 8) + '" y="' + (yT(t) + 4).toFixed(1) + '" text-anchor="end" fill="rgba(255,255,255,0.48)" font-size="11" font-family="-apple-system,sans-serif">' + t + "°</text>"
    ).join("");
    const maxI = temps.indexOf(Math.max.apply(null, temps));
    const minI = temps.indexOf(Math.min.apply(null, temps));
    const pin = (i, t) =>
      '<circle cx="' + xAt(i).toFixed(1) + '" cy="' + yT(t).toFixed(1) + '" r="3.2" fill="#fff" stroke="rgba(0,0,0,0.15)" stroke-width="0.6"/>' +
      '<text x="' + xAt(i).toFixed(1) + '" y="' + (yT(t) - 9).toFixed(1) + '" text-anchor="middle" fill="#fff" font-size="11" font-weight="600" font-family="-apple-system,sans-serif">' + round0(t) + "°</text>";
    el.innerHTML = '<svg viewBox="0 0 ' + W + " " + H + '" preserveAspectRatio="xMidYMid meet" role="img" aria-label="48小时气温与降雨趋势">' +
      '<defs><linearGradient id="tempFill" x1="0" y1="0" x2="0" y2="1">' +
      '<stop offset="0%" stop-color="#ffffff" stop-opacity="0.32"/><stop offset="100%" stop-color="#ffffff" stop-opacity="0"/></linearGradient></defs>' +
      yLabs + bars +
      '<path d="' + area + '" fill="url(#tempFill)" />' +
      '<path d="' + line + '" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/>' +
      pin(maxI, temps[maxI]) + (minI !== maxI ? pin(minI, temps[minI]) : "") +
      labels + "</svg>";
  }

  function iconGroup(name, x, y, s) {
    const p = ICONS[name] || ICONS.cloud;
    const sc = (s || 16) / 24;
    return '<g class="c-icon" transform="translate(' + (x - (s || 16) / 2) + ',' + (y - (s || 16) / 2) + ') scale(' + sc + ')" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">' + p + "</g>";
  }

  function drawDailyChart(d) {
    const el = document.getElementById("daily-chart");
    if (!weather) { el.innerHTML = ""; return; }
    const todayIso = ymd(d);
    const days = weather.daily.time.map((date, i) => ({
      date,
      max: weather.daily.temperature_2m_max[i],
      min: weather.daily.temperature_2m_min[i],
      pop: weather.daily.precipitation_probability_max[i],
      code: weather.daily.weather_code[i],
      label: weekLabel(date, todayIso)
    }));
    const W = 420, H = 200;
    const padL = 10, padR = 10, padT = 28, padB = 40;
    const mins = days.map((x) => x.min), maxs = days.map((x) => x.max);
    const tMin = Math.floor(Math.min.apply(null, mins) - 1);
    const tMax = Math.ceil(Math.max.apply(null, maxs) + 1);
    const n = days.length;
    const xAt = (i) => padL + (i + 0.5) * ((W - padL - padR) / n);
    const yT = (t) => padT + (1 - (t - tMin) / (tMax - tMin || 1)) * (H - padT - padB);
    const hiPts = days.map((day, i) => [xAt(i), yT(day.max)]);
    const loPts = days.map((day, i) => [xAt(i), yT(day.min)]);
    const hi = smoothPath(hiPts, 0.2);
    const loRev = smoothPath(loPts.slice().reverse(), 0.2);
    const lastLo = loPts[loPts.length - 1];
    const band = hi + " L " + lastLo[0].toFixed(1) + "," + lastLo[1].toFixed(1) + " " + loRev.replace(/^M /, "C ").replace(/^C C /, "C ") + " Z";
    /* simpler band: high path then reverse low */
    const loBack = loPts.slice().reverse();
    let bandD = hi;
    bandD += " L " + loPts[loPts.length - 1][0].toFixed(1) + " " + loPts[loPts.length - 1][1].toFixed(1);
    const loPath = smoothPath(loBack, 0.2);
    bandD = hi + " L " + loPts[n - 1][0].toFixed(1) + "," + loPts[n - 1][1].toFixed(1);
    /* build closed shape from high then backward along low */
    let closed = hi;
    for (let i = n - 1; i >= 0; i--) {
      /* we'll just line to lows then use smooth of reversed */
    }
    closed = hi;
    const rPts = loPts.slice().reverse();
    /* continue with cubic by prepending last high already at loPts[n-1] after a line */
    closed += " " + smoothPath(rPts, 0.2).replace(/^M /, "L ") + " Z";

    let labels = "";
    days.forEach((day, i) => {
      const x = xAt(i);
      const y1 = yT(day.max), y2 = yT(day.min);
      labels += '<text x="' + x + '" y="' + (y1 - 10) + '" text-anchor="middle" fill="#fff" font-size="12" font-weight="600" font-family="-apple-system,sans-serif">' + round0(day.max) + "°</text>";
      labels += '<text x="' + x + '" y="' + (y2 + 16) + '" text-anchor="middle" fill="rgba(200,230,255,0.95)" font-size="12" font-family="-apple-system,sans-serif">' + round0(day.min) + "°</text>";
      const dark = false;
      labels += iconGroup(iconName(day.code, dark), x, H - 22, 16);
      labels += '<text x="' + x + '" y="' + (H - 4) + '" text-anchor="middle" fill="rgba(255,255,255,0.86)" font-size="11" font-family="-apple-system,PingFang SC,sans-serif">' + day.label + "</text>";
    });
    el.innerHTML = '<svg viewBox="0 0 ' + W + " " + H + '" preserveAspectRatio="xMidYMid meet" role="img" aria-label="七天高低温">' +
      '<defs><linearGradient id="dayBand" x1="0" y1="0" x2="0" y2="1">' +
      '<stop offset="0%" stop-color="#ffffff" stop-opacity="0.38"/><stop offset="100%" stop-color="#9fd4ff" stop-opacity="0.16"/></linearGradient></defs>' +
      '<path d="' + closed + '" fill="url(#dayBand)" />' +
      '<path d="' + hi + '" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>' +
      '<path d="' + smoothPath(loPts, 0.2) + '" fill="none" stroke="rgba(180,220,255,0.95)" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>' +
      days.map((day, i) =>
        '<circle cx="' + xAt(i) + '" cy="' + yT(day.max) + '" r="3" fill="#fff"/>' +
        '<circle cx="' + xAt(i) + '" cy="' + yT(day.min) + '" r="3" fill="rgb(180,220,255)"/>'
      ).join("") +
      labels + "</svg>";
  }

  function saveCache() {
    try { localStorage.setItem(CACHE_KEY, JSON.stringify({ weather, air, fetchedAt })); } catch (e) {}
  }
  function loadCache() {
    try {
      const raw = localStorage.getItem(CACHE_KEY);
      if (!raw) return false;
      const o = JSON.parse(raw);
      if (!o || !o.weather) return false;
      weather = o.weather;
      air = o.air || null;
      fetchedAt = o.fetchedAt || 0;
      return true;
    } catch (e) { return false; }
  }

  async function loadWeather() {
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), 12000);
    try {
      const [wRes, aRes] = await Promise.all([
        fetch(WEATHER_URL, { signal: ctrl.signal }),
        fetch(AIR_URL, { signal: ctrl.signal }).catch(() => null)
      ]);
      clearTimeout(timer);
      if (!wRes || !wRes.ok) throw new Error("weather " + (wRes && wRes.status));
      const wJson = await wRes.json();
      if (!wJson.current || !wJson.hourly || !wJson.daily) throw new Error("bad weather shape");
      weather = wJson;
      air = null;
      if (aRes && aRes.ok) {
        try { air = await aRes.json(); } catch (e) { air = null; }
      }
      fetchedAt = Date.now();
      fromCache = false;
      cacheNote = "";
      saveCache();
      renderAll();
    } catch (err) {
      clearTimeout(timer);
      if (loadCache()) {
        fromCache = true;
        cacheNote = "网络异常，显示缓存";
        renderAll();
      } else {
        document.getElementById("updated").className = "stale";
        document.getElementById("updated").textContent = "更新失败";
      }
      console.warn("weather fetch failed", err);
    }
  }

  function speak(text) {
    if (!window.speechSynthesis) return;
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = "zh-CN";
    u.rate = 1.02;
    const pick = () => {
      const vs = window.speechSynthesis.getVoices() || [];
      const v = vs.find((x) => /zh-CN|zh_CN|Chinese\s*\(?China\)?|中文|普通话|汉语/.test((x.lang || "") + " " + (x.name || "")));
      if (v) u.voice = v;
    };
    pick();
    if (!u.voice) window.speechSynthesis.onvoiceschanged = () => { pick(); };
    window.speechSynthesis.speak(u);
  }
  function unlockSpeech() {
    if (!window.speechSynthesis) return;
    const u = new SpeechSynthesisUtterance(" ");
    u.lang = "zh-CN";
    u.volume = 0;
    window.speechSynthesis.speak(u);
    window.speechSynthesis.cancel();
  }

  function daySpeech(offset) {
    const today = ymd(nowDate());
    const iso = addDays(today, offset);
    const day = dailyAt(iso);
    if (!day) return "暂时没有这天的预报。";
    const names = ["今天", "明天", "后天"];
    const [desc] = wmo(day.code);
    let s = names[offset] + "苏州" + desc + "，最高气温" + round0(day.max) + "度，最低" + round0(day.min) + "度";
    s += "，降雨概率" + day.pop + "%";
    if (day.pop >= 40) s += "，建议带伞";
    else if (day.pop >= 20 || isRainCode(day.code)) s += "，可能会有短时降雨，可以备一把折叠伞";
    else s += "，基本不用带伞";
    return s + "。";
  }
  function currentSpeech() {
    const cur = weather.current;
    const [desc] = wmo(cur.weather_code);
    const today = dailyAt(ymd(nowDate()));
    let s = "苏州现在" + shortCond(cur.weather_code) + "，" + round1(cur.temperature_2m) + "度，体感" + round0(cur.apparent_temperature) + "度";
    if (today) s += "。今天" + round0(today.max) + "到" + round0(today.min) + "度";
    return s + "。";
  }
  function clothesSpeech() {
    const m = buildOutfitModel(nowDate());
    if (!m) return "暂时没有穿衣建议。";
    return "老于" + (m.useTomorrow ? "明天" : "今天") + "：" + dadKeywords(m).replace(/ · /g, "、") + "。";
  }
  function rainSpeech() {
    const f = focusDay(nowDate());
    const day = dailyAt(f.date);
    const cur = weather.current;
    const label = f.useTomorrow ? "明天" : "今天";
    if (cur && (cur.precipitation > 0 || isRainCode(cur.weather_code)))
      return "现在已经在下雨，出门请带伞。";
    if (!day) return "暂时没有降雨预报。";
    if (day.pop >= 40) return label + "降雨概率" + day.pop + "%，建议带伞。";
    if (day.pop >= 20 || isRainCode(day.code)) return label + "降雨概率" + day.pop + "%，" + wmo(day.code)[0] + "，建议备一把折叠伞。";
    return label + "降雨概率只有" + day.pop + "%，可以不带伞。";
  }
  function commuteSpeech() {
    const tom = addDays(ymd(nowDate()), 1);
    const [y, m, dd] = tom.split("-").map(Number);
    const wi = new Date(Date.UTC(y, m - 1, dd)).getUTCDay();
    if (wi === 0 || wi === 6) return "明天是周末，没有苏州到镇江的通勤安排。";
    const c = commuteWindow(tom);
    if (!c) return "暂时没有明早通勤时段的预报。";
    let s = "明早五点到八点，苏州气温大约" + round0(c.min) + "到" + round0(c.max) + "度";
    s += "，降雨概率" + c.pop + "%";
    if (c.rain || c.pop >= 40) s += "，路上可能下雨，高速注意湿滑";
    else if (c.fog) s += "，可能有雾，注意驾驶";
    else s += "，路况比较平稳";
    if (c.ice) s += "，低温注意结冰";
    return s + "。开车大约五点四十出发，车上比较暖，外套可以上车后再脱。";
  }
  function aqiSpeech() {
    if (!air || !air.current || air.current.us_aqi == null) return "暂时没有空气质量数据。";
    const a = aqiInfo(air.current.us_aqi);
    let s = "当前美国AQI指数" + round0(air.current.us_aqi) + "，空气质量" + a.label;
    if (air.current.pm2_5 != null) s += "，PM2.5为" + round1(air.current.pm2_5);
    if (air.current.us_aqi >= 101) s += "，建议出门戴口罩";
    else s += "，空气还可以";
    return s + "。";
  }
  function windSpeech() {
    const w = weather.current.wind_speed_10m;
    let s = "现在风速大约" + round0(w) + "公里每小时";
    if (w >= 25) s += "，风比较大，出门注意防风，穿防风外套更合适";
    else if (w >= 15) s += "，有些风，体感会更凉一些";
    else s += "，风不大";
    return s + "。";
  }
  function trendSpeech() {
    const today = ymd(nowDate());
    const parts = weather.daily.time.slice(0, 7).map((date, i) => {
      const lab = weekLabel(date, today);
      return lab + wmo(weather.daily.weather_code[i])[0] + "，" +
        round0(weather.daily.temperature_2m_min[i]) + "到" +
        round0(weather.daily.temperature_2m_max[i]) + "度";
    });
    return "未来七天趋势：" + parts.join("；") + "。";
  }
  function timeSpeech() {
    const d = nowDate();
    const p = tzParts(d, { hour: "2-digit", minute: "2-digit" });
    return "现在是苏州时间" + p.hour + "点" + p.minute + "分，" + gregDateText(d) + "，" + CN_WEEK[weekdayIndex(d)] + "，" + lunarText(d) + "。";
  }
  function fullSummary() {
    if (!weather) return "天气数据还没准备好，请稍后再试。";
    const tips = buildTips(nowDate()).map((t) => t.text).join("，");
    return timeSpeech() + currentSpeech() + clothesSpeech() + kidClothesSpeech() + (tips ? tips + "。" : "");
  }

  function answerIntent(q) {
    if (!weather) return "天气数据还没准备好，请稍后再试。";
    const s = String(q || "").replace(/\s+/g, "");
    if (/通勤|明早|上班|高速|镇江/.test(s)) return commuteSpeech();
    if (/空气|雾霾|pm2|PM2|口罩|污染|aqi|AQI/.test(s)) return aqiSpeech();
    if (/儿子|睿航/.test(s)) return kidClothesSpeech();
    if (/穿什么|穿衣|衣服|穿搭|穿啥|怎么穿/.test(s)) return clothesSpeech();
    if (/趋势|未来几天|未来七天|一周|七天/.test(s)) return trendSpeech();
    if (/后天/.test(s)) return daySpeech(2);
    if (/明天/.test(s)) return daySpeech(1);
    if (/几点|现在几点|日期|几号|星期|农历|今天是/.test(s) && !/天气|气温|温度|下雨|最高|最低/.test(s))
      return timeSpeech();
    if (/下雨|带伞|降雨|雨伞|会不会下|要不要伞/.test(s)) return rainSpeech();
    if (/(风速|风大|有风|大风|刮风)/.test(s) || (/风/.test(s) && !/风衣/.test(s))) return windSpeech();
    if (/今天/.test(s)) return daySpeech(0);
    if (/现在|实时|当前|外面|温度|气温|天气/.test(s)) return currentSpeech();
    return currentSpeech();
  }

  function showQA(q, a) {
    const el = document.getElementById("transcript");
    el.hidden = false;
    el.innerHTML = (q ? '<span class="q">' + escapeHtml(q) + "  </span>" : "") +
      '<span class="a">' + escapeHtml(a) + "</span>";
  }
  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  }

  let rec = null;
  let listening = false;
  function setupVoice() { /* voice UI removed */ }

  window.__desk = {
    answerIntent, buildOutfitModel, buildKidOutfitModel, buildTips, wmo, lunarText, focusDay, focusSchoolDay, nowDate, applySky, kidClothesSpeech,
    getState: () => ({ weather, air, fetchedAt, fromCache })
  };

  tick();
  setInterval(tick, 1000);
  setupVoice();
  if (loadCache()) {
    fromCache = false;
    cacheNote = "";
    renderAll();
  }
  loadWeather();
  setInterval(loadWeather, 15 * 60 * 1000);
  function onResume() {
    tick();
    if (Date.now() - fetchedAt > 15 * 60 * 1000) loadWeather();
  }
  document.addEventListener("visibilitychange", () => {
    if (!document.hidden) onResume();
  });
  window.addEventListener("pageshow", onResume);
  window.addEventListener("focus", onResume);
})();

</script>
