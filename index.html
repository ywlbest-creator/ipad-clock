<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="苏州时钟">
<meta name="theme-color" content="#1a2450">
<meta name="format-detection" content="telephone=no">
<title>苏州时钟 · 老于</title>
<style>
  :root {
    --text: #ffffff;
    --muted: rgba(255,255,255,0.72);
    --dim: rgba(255,255,255,0.48);
    --glass: rgba(255,255,255,0.16);
    --glass-strong: rgba(255,255,255,0.22);
    --stroke: rgba(255,255,255,0.28);
    --shadow: 0 10px 40px rgba(0,0,0,0.18), inset 0 1px 0 rgba(255,255,255,0.2);
    --rain: #9fd4ff;
    --ok: #8ee0b5;
    --warn: #ffd089;
    --bad: #ff9b8f;
    --pad: max(20px, env(safe-area-inset-top)) max(24px, env(safe-area-inset-right)) max(16px, env(safe-area-inset-bottom)) max(24px, env(safe-area-inset-left));
    --radius: 20px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "SF Pro", "PingFang SC", "Hiragino Sans GB", "Helvetica Neue", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    -webkit-user-select: none;
    user-select: none;
    overflow: hidden;
    background: #1a2450;
  }
  body {
    display: flex;
    flex-direction: column;
    padding: var(--pad);
    gap: 16px;
    min-height: 100dvh;
    height: 100dvh;
    height: 100vh;
    position: relative;
    isolation: isolate;
  }
  body.sky-night-clear, body.sky-night-cloud, body.sky-night-rain,
  body.sky-evening-clear, body.sky-evening-cloud, body.sky-evening-rain {
    --glass: rgba(255,255,255,0.10);
    --glass-strong: rgba(255,255,255,0.14);
    --stroke: rgba(255,255,255,0.20);
    --shadow: 0 12px 36px rgba(0,0,0,0.28), inset 0 1px 0 rgba(255,255,255,0.14);
  }

  .sky { position: fixed; inset: 0; z-index: -1; overflow: hidden; pointer-events: none; transition: background 1.2s ease; }
  .sky-orb {
    position: absolute;
    border-radius: 50%;
    pointer-events: none;
    transition: all 1.2s ease;
  }
  .sky-haze {
    position: absolute; inset: 0;
    background: radial-gradient(120% 80% at 80% 0%, rgba(255,255,255,0.14), transparent 55%);
  }

  body.sky-day-clear .sky { background: linear-gradient(180deg, #1a6fc4 0%, #4aa3e0 48%, #87c5ef 100%); }
  body.sky-day-clear .sky-orb {
    width: 300px; height: 300px; top: -60px; right: 16%;
    background: radial-gradient(circle, #fff8d0 0%, #ffd56a 32%, rgba(255,190,80,0) 68%);
  }
  body.sky-day-cloudy .sky { background: linear-gradient(180deg, #4e7eab 0%, #6f9cc0 50%, #97b8d4 100%); }
  body.sky-day-cloudy .sky-orb {
    width: 240px; height: 240px; top: -50px; right: 20%;
    background: radial-gradient(circle, rgba(255,244,210,0.7) 0%, rgba(255,220,140,0.15) 40%, transparent 70%);
  }
  body.sky-day-overcast .sky { background: linear-gradient(180deg, #5a6e82 0%, #6d8296 48%, #8a9aaa 100%); }
  body.sky-day-overcast .sky-orb { display: none; }
  body.sky-day-rain .sky { background: linear-gradient(180deg, #3d556c 0%, #4a6580 50%, #5c7388 100%); }
  body.sky-day-rain .sky-orb { display: none; }
  body.sky-day-fog .sky { background: linear-gradient(180deg, #7a8794 0%, #9aa6b2 50%, #c0c8d0 100%); }
  body.sky-day-fog .sky-orb { display: none; }
  body.sky-day-snow .sky { background: linear-gradient(180deg, #6a7e96 0%, #8ea0b4 50%, #c5d0dc 100%); }

  body.sky-dawn .sky { background: linear-gradient(180deg, #3a4a7a 0%, #e08970 58%, #f0c8a8 100%); }
  body.sky-dawn .sky-orb {
    width: 220px; height: 220px; top: 28%; right: 14%;
    background: radial-gradient(circle, #ffe0b0 0%, #ff9a62 40%, rgba(255,120,80,0) 70%);
  }

  body.sky-sunset-clear .sky { background: linear-gradient(180deg, #1a3a6b 0%, #c45c3e 42%, #e89a5a 72%, #f0c07a 100%); }
  body.sky-sunset-clear .sky-orb {
    width: 240px; height: 240px; bottom: 8%; right: 12%;
    background: radial-gradient(circle, #ffe7b0 0%, #ff8a4a 36%, rgba(255,80,40,0) 68%);
  }
  body.sky-sunset-cloud .sky { background: linear-gradient(180deg, #2c3a50 0%, #8a5a4a 52%, #c48462 100%); }
  body.sky-sunset-cloud .sky-orb {
    width: 200px; height: 200px; bottom: 10%; right: 16%;
    background: radial-gradient(circle, rgba(255,200,140,0.7) 0%, rgba(255,120,70,0.2) 50%, transparent 70%);
  }

  body.sky-evening-clear .sky { background: linear-gradient(180deg, #10183a 0%, #1c2a5c 55%, #3a3a7a 100%); }
  body.sky-evening-clear .sky-orb {
    width: 150px; height: 150px; top: 8%; right: 18%;
    background: radial-gradient(circle, #f4f6ff 0%, #c9d2f0 28%, rgba(160,180,255,0) 70%);
  }
  body.sky-evening-cloud .sky, body.sky-evening-rain .sky { background: linear-gradient(180deg, #10161f 0%, #1a2433 60%, #2a3548 100%); }
  body.sky-evening-cloud .sky-orb, body.sky-evening-rain .sky-orb { display: none; }

  body.sky-night-clear .sky { background: linear-gradient(180deg, #070b18 0%, #121a38 52%, #1a2450 100%); }
  body.sky-night-clear .sky-orb {
    width: 150px; height: 150px; top: 6%; right: 18%;
    background: radial-gradient(circle, #f5f7ff 0%, #d0d8f4 28%, rgba(160,180,255,0) 68%);
  }
  body.sky-night-cloud .sky { background: linear-gradient(180deg, #0c1018 0%, #1a2230 60%, #243040 100%); }
  body.sky-night-cloud .sky-orb { display: none; }
  body.sky-night-rain .sky { background: linear-gradient(180deg, #0a1018 0%, #15202c 100%); }
  body.sky-night-rain .sky-orb { display: none; }

  .header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 16px;
    flex-shrink: 0;
    font-size: 16px;
    font-weight: 400;
    text-shadow: 0 1px 12px rgba(0,0,0,0.18);
  }
  .header .date-line { font-weight: 500; }
  .header .lunar { color: var(--muted); margin-left: 14px; font-weight: 400; }
  .header .meta { color: var(--muted); font-size: 14px; white-space: nowrap; }
  .header .meta .sep { margin: 0 8px; color: var(--dim); }
  .header .stale { color: var(--warn); }

  .top {
    display: grid;
    grid-template-columns: 1.05fr 1.35fr;
    gap: 18px;
    flex: 0 0 auto;
    min-height: 0;
  }
  .clock-block {
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 2px 8px 0 2px;
  }
  #clock {
    font-size: clamp(76px, 11.4vw, 156px);
    font-weight: 200;
    font-variation-settings: "wght" 200;
    letter-spacing: -0.045em;
    line-height: 0.88;
    font-variant-numeric: tabular-nums;
    font-feature-settings: "tnum";
    color: var(--text);
    text-shadow: 0 2px 28px rgba(0,0,0,0.16);
  }
  #clock .sec {
    font-size: 0.38em;
    color: var(--muted);
    letter-spacing: -0.02em;
    margin-left: 0.14em;
    font-weight: 200;
    vertical-align: 0.14em;
  }
  .weekday-big {
    margin-top: 12px;
    font-size: 17px;
    font-weight: 400;
    color: var(--muted);
    letter-spacing: 0.04em;
  }

  .glass {
    background: var(--glass);
    -webkit-backdrop-filter: saturate(160%) blur(36px);
    backdrop-filter: saturate(160%) blur(36px);
    border: 1px solid var(--stroke);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    min-width: 0;
  }

  .now-card {
    padding: 16px 20px 14px;
    display: grid;
    grid-template-columns: auto 1fr;
    grid-template-rows: auto auto auto;
    column-gap: 16px;
    row-gap: 4px;
  }
  .now-kicker {
    grid-column: 1 / -1;
    font-size: 12px;
    letter-spacing: 0.08em;
    color: var(--muted);
    font-weight: 600;
  }
  .now-icon { width: 64px; height: 64px; align-self: center; color: #fff; }
  .now-icon svg { width: 64px; height: 64px; display: block; filter: drop-shadow(0 4px 12px rgba(0,0,0,0.18)); }
  .now-main { display: flex; flex-direction: column; justify-content: center; min-width: 0; }
  .now-temp-row { display: flex; align-items: baseline; gap: 12px; }
  #now-temp {
    font-size: clamp(58px, 6.6vw, 92px);
    font-weight: 200;
    font-variation-settings: "wght" 200;
    letter-spacing: -0.045em;
    line-height: 0.9;
    font-variant-numeric: tabular-nums;
    text-shadow: 0 2px 20px rgba(0,0,0,0.14);
  }
  #now-temp span { font-size: 0.36em; color: var(--muted); margin-left: 2px; font-weight: 300; }
  #now-desc { font-size: 24px; font-weight: 500; white-space: nowrap; margin-left: 4px; }
  .now-sub { color: var(--muted); font-size: 15px; margin-top: 4px; font-weight: 400; }
  .now-metrics {
    grid-column: 1 / -1;
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 8px;
    margin-top: 10px;
    border-top: 1px solid rgba(255,255,255,0.16);
    padding-top: 10px;
  }
  .metric { text-align: center; min-width: 0; }
  .metric .lab { display: block; font-size: 11px; color: var(--dim); margin-bottom: 3px; font-weight: 500; }
  .metric .val { font-size: 16px; font-weight: 590; font-variant-numeric: tabular-nums; }
  .metric .val.bad { color: var(--bad); }
  .metric .val.warn { color: var(--warn); }
  .metric .val.ok { color: var(--ok); }

  .mid {
    display: grid;
    grid-template-columns: 1.15fr 0.95fr 0.9fr;
    gap: 16px;
    flex: 0 0 auto;
    align-items: stretch;
  }
  .mid .card { overflow: hidden; }
  .kid-note { margin-top: 10px; font-size: 13px; color: var(--muted); line-height: 1.4; }
  .card { padding: 16px 18px 18px; min-height: 0; }
  .card h2 {
    font-size: 13px;
    letter-spacing: 0.06em;
    color: var(--muted);
    font-weight: 600;
    margin-bottom: 10px;
  }
  .outfit-head {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 8px;
    margin-bottom: 10px;
  }
  .outfit-head h2 { margin-bottom: 0; color: var(--text); font-size: 15px; letter-spacing: 0.02em; }
  .outfit-tag { color: var(--muted); font-size: 13px; }
  .outfit-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px 20px;
  }
  .outfit-col h3 {
    font-size: 14px;
    color: var(--text);
    font-weight: 600;
    margin-bottom: 8px;
  }
  .outfit-col h3 span { color: var(--muted); font-weight: 400; margin-left: 8px; font-size: 13px; }
  .kv { display: grid; grid-template-columns: 2.2em 1fr; gap: 4px 8px; font-size: 14px; line-height: 1.4; }
  .kv dt { color: var(--dim); }
  .kv dd { color: var(--text); }

  .tips-list { list-style: none; display: flex; flex-direction: column; gap: 9px; }
  .tips-list li {
    font-size: 15px;
    line-height: 1.45;
    color: var(--text);
    display: flex;
    align-items: flex-start;
    gap: 10px;
  }
  .tips-list li .mark { width: 20px; height: 20px; flex: 0 0 20px; margin-top: 1px; color: #fff; opacity: 0.92; }
  .tips-list li .mark svg { width: 20px; height: 20px; display: block; }

  .strip-card { flex: 0 0 auto; }
  .strip {
    display: grid;
    grid-template-columns: repeat(12, 1fr);
    gap: 8px;
  }
  .hour {
    text-align: center;
    padding: 8px 0 9px;
    border-radius: 14px;
    background: rgba(255,255,255,0.08);
  }
  .hour .t { font-size: 12px; color: var(--muted); font-weight: 500; }
  .hour .e { height: 28px; margin: 6px 0 2px; color: #fff; display: flex; align-items: center; justify-content: center; }
  .hour .e svg { width: 26px; height: 26px; display: block; }
  .hour .d { font-size: 15px; font-weight: 590; font-variant-numeric: tabular-nums; }
  .hour .p { font-size: 11px; color: var(--rain); height: 14px; font-weight: 500; }

  .charts {
    display: grid;
    grid-template-columns: 1.45fr 1fr;
    gap: 18px;
    flex: 1 1 auto;
    min-height: 168px;
  }
  .chart-card { display: flex; flex-direction: column; min-height: 0; }
  .chart-card .svg-wrap { flex: 1; min-height: 128px; position: relative; overflow: visible; }
  .chart-card svg { width: 100%; height: 100%; display: block; overflow: visible; }
  .legend { color: var(--muted); font-size: 11px; margin-top: 4px; font-weight: 500; }
  .legend i { font-style: normal; margin-right: 14px; }
  .legend .t { color: #fff; }
  .legend .r { color: var(--rain); }

  .voice-bar {
    flex-shrink: 0;
    display: grid;
    grid-template-columns: auto 1fr;
    gap: 14px;
    align-items: center;
    min-height: 56px;
    z-index: 9;
  }
  .segmented {
    display: flex;
    align-items: stretch;
    background: var(--glass-strong);
    -webkit-backdrop-filter: saturate(160%) blur(24px);
    backdrop-filter: saturate(160%) blur(24px);
    border: 1px solid var(--stroke);
    border-radius: 999px;
    padding: 3px;
    box-shadow: var(--shadow);
  }
  .segmented button {
    appearance: none;
    border: 0;
    background: transparent;
    color: var(--text);
    font: inherit;
    font-size: 15px;
    font-weight: 590;
    letter-spacing: 0.04em;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 7px;
    height: 42px;
    padding: 0 20px;
    border-radius: 999px;
    -webkit-tap-highlight-color: transparent;
    transition: background 0.2s ease;
  }
  .segmented button svg { width: 18px; height: 18px; display: block; }
  .segmented button + button { position: relative; }
  .segmented button:hover { background: rgba(255,255,255,0.12); }
  .segmented button.listening,
  .segmented button:active {
    background: rgba(255,255,255,0.28);
  }
  #mic-btn.listening { box-shadow: 0 0 0 4px rgba(255,255,255,0.12); }
  .transcript {
    min-width: 0;
    font-size: 14px;
    line-height: 1.45;
    color: var(--muted);
    text-shadow: 0 1px 8px rgba(0,0,0,0.16);
  }
  .transcript .q { color: var(--text); }
  .transcript .a { color: rgba(255,255,255,0.88); }
  .transcript .hint { color: var(--muted); }
  .unsupported { color: var(--warn); }

  @media (orientation: portrait) {
    body { gap: 12px; overflow: auto; }
    .top, .mid, .charts { grid-template-columns: 1fr; }
    #clock { font-size: clamp(76px, 18vw, 164px); }
    .charts { min-height: 420px; }
    .chart-card { min-height: 200px; }
  }
  @media (max-height: 900px) and (orientation: landscape) {
    body { gap: 12px; }
    #clock { font-size: clamp(64px, 9vw, 120px); }
    #now-temp { font-size: clamp(48px, 5.2vw, 72px); }
    #now-desc { font-size: 22px; }
    .now-icon, .now-icon svg { width: 48px; height: 48px; }
  }
</style>
</head>
<body>
  <div class="sky" aria-hidden="true"><div class="sky-orb"></div><div class="sky-haze"></div></div>

  <header class="header">
    <div class="date-line">
      <span id="greg-date">—</span>
      <span class="lunar" id="lunar-date"></span>
    </div>
    <div class="meta">
      <span>苏州</span>
      <span class="sep">·</span>
      <span id="updated">正在更新天气…</span>
    </div>
  </header>

  <section class="top">
    <div class="clock-block">
      <div id="clock">--:--<span class="sec">--</span></div>
      <div class="weekday-big" id="weekday"></div>
    </div>
    <article class="glass now-card" id="now-card">
      <div class="now-kicker">实时天气</div>
      <div class="now-icon" id="now-icon"></div>
      <div class="now-main">
        <div class="now-temp-row">
          <div id="now-temp">--<span>°C</span></div>
          <div id="now-desc">载入中</div>
        </div>
        <div class="now-sub" id="now-sub"></div>
      </div>
      <div class="now-metrics" id="now-metrics"></div>
    </article>
  </section>

  <section class="mid">
    <article class="glass card outfit-card" id="outfit-card">
      <div class="outfit-head">
        <h2 id="outfit-title">今日穿衣</h2>
        <div class="outfit-tag" id="outfit-tag"></div>
      </div>
      <div class="outfit-grid" id="outfit-body"></div>
    </article>
    <article class="glass card outfit-card" id="kid-card">
      <div class="outfit-head">
        <h2 id="kid-title">睿航上学穿衣</h2>
        <div class="outfit-tag" id="kid-tag"></div>
      </div>
      <div id="kid-body"></div>
    </article>
    <article class="glass card">
      <h2>注意事项</h2>
      <ul class="tips-list" id="tips-list"></ul>
    </article>
  </section>

  <article class="glass card strip-card">
    <h2>未来十二小时</h2>
    <div class="strip" id="hour-strip"></div>
  </article>

  <section class="charts">
    <article class="glass card chart-card">
      <h2>天气趋势 · 48小时</h2>
      <div class="svg-wrap" id="hourly-chart"></div>
      <div class="legend"><i class="t">— 气温</i><i class="r">▮ 降雨概率</i></div>
    </article>
    <article class="glass card chart-card">
      <h2>七天高低温</h2>
      <div class="svg-wrap" id="daily-chart"></div>
    </article>
  </section>

  <footer class="voice-bar">
    <div class="segmented" role="group" aria-label="语音">
      <button type="button" id="mic-btn" aria-label="语音问询" title="语音问询">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="8.2" y="3.2" width="7.6" height="11.2" rx="3.8"/><path d="M6 11.5a6 6 0 0 0 12 0"/><path d="M12 17.5v3.2M8.5 20.7h7"/></svg>
        问询
      </button>
      <button type="button" id="talk-btn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 10.5v3h3.2L11 18V6L6.7 10.5H3.5z"/><path d="M15 9.2a4.2 4.2 0 0 1 0 5.6"/><path d="M17.6 7a7.2 7.2 0 0 1 0 10"/></svg>
        播报
      </button>
    </div>
    <div class="transcript" id="transcript">
      <span class="hint">点「问询」可以说：现在多少度、明天要不要带伞、穿什么、睿航穿什么、明早通勤、空气质量……</span>
    </div>
  </footer>
<script>
(function () {
  const TZ = "Asia/Shanghai";
  const CACHE_KEY = "suzhou-desk-clock-v2";
  const WEATHER_URL = "https://api.open-meteo.com/v1/forecast?latitude=31.30&longitude=120.62&current=temperature_2m,apparent_temperature,relative_humidity_2m,weather_code,wind_speed_10m,precipitation&hourly=temperature_2m,apparent_temperature,precipitation_probability,weather_code,wind_speed_10m&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max,uv_index_max,sunrise,sunset,weather_code&timezone=Asia%2FShanghai&forecast_days=7";
  const AIR_URL = "https://air-quality-api.open-meteo.com/v1/air-quality?latitude=31.30&longitude=120.62&current=pm2_5,us_aqi&timezone=Asia%2FShanghai";

  const ICONS = {

    const winds = hrs.map((x) => x.wind || 0);
    const codes = hrs.map((x) => x.code);
    const leaveTemp = at7 ? (at7.apparent != null ? at7.apparent : at7.temp) : (day.min);
    const leaveAir = at7 ? at7.temp : day.min;
    const pop = pops.length ? Math.max.apply(null, pops) : day.pop;
    const wind = winds.length ? Math.max.apply(null, winds) : 0;
    const code = (at7 && at7.code != null) ? at7.code : day.code;
    const rec = kidOutfitFor(leaveTemp, day.max, wind, pop, code);
    const today = ymd(d);
    const wlab = weekLabel(date, today);
    const weekday = "周" + CN_DAY[isoWeekday(date)];
    /* Weekends (and Friday night → Monday) prefer 「周一 07:20」; otherwise 今天/明天. */
    let when;
    if (wlab === "今天") when = "今天 07:20";
    else if (wlab === "明天" && isoWeekday(date) !== 1) when = "明天 07:20";
    else when = weekday + " 07:20";
    return {
      date, when, leaveTemp, leaveAir, dayTemp: day.max, pop, wind, code, rec,
      label: when + "  ·  " + round0(leaveTemp) + "°"
    };
  }

  function outfitFor(morningTemp, dayTemp, wind, pop, code, swing) {
    const tMorn = morningTemp;
    const tDay = dayTemp;
    function topFor(t, role) {
      let top, extra = "";
      if (t >= 28) top = "短袖T恤或薄衬衫";
      else if (t >= 22) top = "薄长袖或短袖衬衫";
      else if (t >= 15) top = role === "morn" ? "长袖衬衫或薄卫衣，外加薄外套" : "长袖衬衫或薄卫衣，凉则加薄外套";
      else if (t >= 8) top = "长袖衬衫或薄毛衣，外加夹克/风衣";
      else if (t >= 0) top = "毛衣或卫衣，外加厚外套/羽绒服";
      else top = "保暖内衣+厚毛衣，外加羽绒服";
      if (t < 22) extra = "车上可脱外套";
      if (wind >= 25 && t < 22) top = top.replace("夹克/风衣", "防风夹克/风衣");
      return { top, extra };
    }
    function bottomFor(t) {
      if (t >= 30) return "薄长裤或短裤";
      if (t >= 0) return "长裤";
      return "加绒长裤或保暖内衣+长裤";
    }
    function shoesFor(t, rainy) {
      if (rainy) return t < 8 ? "防滑保暖鞋" : "防水或不易湿的休闲鞋";
      if (t >= 22) return "透气休闲鞋或运动鞋";
      if (t >= 8) return "休闲鞋或运动鞋";
      return "保暖休闲鞋或短靴";
    }
    const rainy = pop >= 40;
    const maybeRain = pop >= 20 || isRainCode(code);
    const acc = [];
    if (tMorn < 0) acc.push("帽子、手套、围巾");
    else if (tMorn < 5 && wind >= 15) acc.push("薄围巾或帽子");
    if (pop >= 40) acc.push("雨伞");
    else if (maybeRain) acc.push("备折叠伞");
    if (swing >= 8) acc.push("外套方便穿脱，温差大");
    const m = topFor(tMorn, "morn");
    const dy = topFor(tDay, "day");
    return {
      morning: {
        top: m.top, bottom: bottomFor(tMorn), shoes: shoesFor(tMorn, rainy),
        acc: [m.extra, ...acc].filter(Boolean).join("，") || "无需特别配件"
      },
      day: {
        top: dy.top, bottom: bottomFor(tDay), shoes: shoesFor(tDay, rainy),
        acc: dy.extra || ""
      }
    };
  }
  function bandLabel(t) {
    if (t >= 28) return "短袖即可";
    if (t >= 22) return "薄长袖";
    if (t >= 15) return "外套/卫衣";
    if (t >= 8) return "夹克/风衣";
    if (t >= 0) return "厚外套/羽绒";
    return "严寒保暖";
  }
  function focusDay(d) {
    const today = ymd(d);
    const tomorrow = addDays(today, 1);
    const useTomorrow = hourNum(d) >= 18;
    lastFocusTomorrow = useTomorrow;
    return { today, tomorrow, useTomorrow, date: useTomorrow ? tomorrow : today };
  }
  function buildOutfitModel(d) {
    const f = focusDay(d);
    const day = dailyAt(f.date);
    if (!day) return null;
    const mornHrs = hoursInRange(f.date, 5, 8);
    const morningTemp = mornHrs.length
      ? mornHrs.reduce((s, x) => Math.min(s, x.temp), 99)
      : day.min;
    const dayTemp = day.max;
    const swing = day.max - day.min;
    const cur = weather.current;
    const wind = cur ? cur.wind_speed_10m : 0;
    const outfit = outfitFor(morningTemp, dayTemp, wind, day.pop, day.code, swing);
    const wi = (function () {
      const [y, m, dd] = f.date.split("-").map(Number);
      return new Date(Date.UTC(y, m - 1, dd)).getUTCDay();
    })();
    const isCommuteDay = wi >= 1 && wi <= 5;
    return {
      title: f.useTomorrow ? "明日穿衣" : "今日穿衣",
      tag: weekLabel(f.date, f.today) + " · " + bandLabel(morningTemp) + (isCommuteDay ? " · 通勤日" : ""),
      isCommuteDay, date: f.date, morningTemp, dayTemp, swing, pop: day.pop, code: day.code, outfit,
      useTomorrow: f.useTomorrow
    };
  }
  function renderOutfit(d) {
    const m = buildOutfitModel(d);

    if (!m) { body.innerHTML = "<p>暂无数据</p>"; return; }

      "<dt>配件</dt><dd>" + (rec.acc || "—") + "</dd></dl></div>";

    body.innerHTML =
      col(mornLabel, "约5:40  " + round0(m.morningTemp) + "°", o.morning) +
      col("白天", "最高 " + round0(m.dayTemp) + "°", o.day);

  function commuteWindow(isoDate) {
    const hrs = hoursInRange(isoDate, 5, 8);
    if (!hrs.length) return null;
    const temps = hrs.map((x) => x.temp);
    const pops = hrs.map((x) => x.pop);
    const codes = hrs.map((x) => x.code);
    return {
      min: Math.min.apply(null, temps),
      max: Math.max.apply(null, temps),
      pop: Math.max.apply(null, pops),
      rain: codes.some(isRainCode),
      fog: codes.some(isFogCode),
      ice: codes.some(isIceCode) || Math.min.apply(null, temps) <= 0
    };
  }
  function buildTips(d) {
    const tips = [];
    if (!weather) return [{ icon: "cloud", text: "天气数据尚未载入" }];
    const f = focusDay(d);
    const day = dailyAt(f.date);
    const cur = weather.current;
    const tomWi = (function () {
      const [y, m, dd] = f.tomorrow.split("-").map(Number);
      return new Date(Date.UTC(y, m - 1, dd)).getUTCDay();
    })();
    if (tomWi >= 1 && tomWi <= 5) {
      const c = commuteWindow(f.tomorrow);
      if (c) {
        let s = "明早通勤（约5:40 苏州→镇江高速）气温 " + round0(c.min) + "–" + round0(c.max) + "°C";
        if (c.pop >= 40 || c.rain) s += "，有雨，路面可能湿滑，注意驾驶";
        else if (c.fog) s += "，可能有雾，注意驾驶";
        else if (c.pop >= 20) s += "，有小雨可能，注意路况";
        else s += "，降雨概率 " + c.pop + "%";
        if (c.ice) s += "；低温注意结冰";
        tips.push({ icon: "car", text: s });
      }
    }
    if (day) {
      if (day.pop >= 40 || isRainCode(day.code) && day.pop >= 20) tips.push({ icon: "umbrella", text: "出门请带伞（降雨概率 " + day.pop + "%）" });
      if (day.uv >= 6) tips.push({ icon: "sun", text: "紫外线较强（UV " + round1(day.uv) + "），注意防晒" });
      if (day.max - day.min >= 8) tips.push({ icon: "thermometer", text: "温差约 " + round0(day.max - day.min) + "°C，注意增减衣物" });
      if (day.min <= 0 || isIceCode(day.code)) tips.push({ icon: "ice", text: "低温可能结冰，驾车注意防滑" });
      else if (day.min <= 2) tips.push({ icon: "ice", text: "早晨较冷（最低 " + round0(day.min) + "°C），留意路面情况" });
      if (isFogCode(day.code) || (cur && isFogCode(cur.weather_code)))
        tips.push({ icon: "fog", text: "有雾，路面可能湿滑，注意驾驶" });
    }
    if (cur && cur.wind_speed_10m >= 25) tips.push({ icon: "wind", text: "风较大（" + round0(cur.wind_speed_10m) + " km/h），注意防风" });
    else if (cur && cur.wind_speed_10m >= 20) tips.push({ icon: "wind", text: "有风（" + round0(cur.wind_speed_10m) + " km/h）" });
    if (air && air.current && air.current.us_aqi != null) {
      const a = aqiInfo(air.current.us_aqi);
      if (air.current.us_aqi >= 101)
        tips.push({ icon: "mask", text: "空气质量" + a.label + "（AQI " + round0(air.current.us_aqi) + "），建议戴口罩" });
    }
    if (cur && (cur.precipitation > 0 || isRainCode(cur.weather_code)))
      tips.push({ icon: "rain", text: "当前有降水，路面湿滑，注意驾驶" });
    if (!tips.length) tips.push({ icon: "check", text: "天气平稳，按推荐穿衣即可，出门注意安全" });
    return tips;
  }
  function renderTips(d) {

  function smoothPath(pts, tension) {
    if (pts.length < 2) return "";
    const t = tension == null ? 0.18 : tension;
    let d = "M " + pts[0][0] + " " + pts[0][1];
    for (let i = 0; i < pts.length - 1; i++) {
      const p0 = pts[Math.max(0, i - 1)];
      const p1 = pts[i];
      const p2 = pts[i + 1];
      const p3 = pts[Math.min(pts.length - 1, i + 2)];
      const cp1x = p1[0] + (p2[0] - p0[0]) * t;
      const cp1y = p1[1] + (p2[1] - p0[1]) * t;
      const cp2x = p2[0] - (p3[0] - p1[0]) * t;
      const cp2y = p2[1] - (p3[1] - p1[1]) * t;
      d += " C " + cp1x.toFixed(1) + "," + cp1y.toFixed(1) + " " + cp2x.toFixed(1) + "," + cp2y.toFixed(1) + " " + p2[0].toFixed(1) + "," + p2[1].toFixed(1);
    }
    return d;
  }

  function drawHourlyChart(d) {
    const hours = hourlyFrom(currentHourStamp(d), 48);
    const el = document.getElementById("hourly-chart");
    if (hours.length < 4) { el.innerHTML = ""; return; }
    const W = 640, H = 200;
    const padL = 36, padR = 14, padT = 18, padB = 28;
    const temps = hours.map((x) => x.temp);
    const tMin = Math.floor(Math.min.apply(null, temps) - 1);
    const tMax = Math.ceil(Math.max.apply(null, temps) + 1);
    const n = hours.length;
    const xAt = (i) => padL + (i / (n - 1)) * (W - padL - padR);
    const yT = (t) => padT + (1 - (t - tMin) / (tMax - tMin || 1)) * (H - padT - padB);
    const barW = Math.max(2.2, (W - padL - padR) / n * 0.5);
    let bars = "";
    hours.forEach((h, i) => {
      const bh = (h.pop / 100) * (H - padT - padB) * 0.82;
      const x = xAt(i) - barW / 2;
      const y = H - padB - bh;
      const a = 0.18 + 0.5 * (h.pop / 100);
      bars += '<rect x="' + x.toFixed(1) + '" y="' + y.toFixed(1) + '" width="' + barW.toFixed(1) + '" height="' + Math.max(0, bh).toFixed(1) + '" rx="1.6" fill="rgba(159,212,255,' + a.toFixed(2) + ')" />';
    });
    const pts = hours.map((h, i) => [xAt(i), yT(h.temp)]);
    const line = smoothPath(pts);
    const area = line + " L " + pts[pts.length - 1][0].toFixed(1) + " " + (H - padB) + " L " + pts[0][0].toFixed(1) + " " + (H - padB) + " Z";
    let labels = "";
    const todayIso = ymd(d);
    hours.forEach((h, i) => {
      if (i % 6 !== 0 && i !== 0) return;
      let lab = h.hour + "时";
      if (h.date !== todayIso && h.hour === 0) lab = weekLabel(h.date, todayIso);
      else if (h.date !== todayIso) lab = weekLabel(h.date, todayIso) + " " + h.hour + "时";
      const anchor = (i === 0) ? "start" : "middle";
      const x = i === 0 ? (xAt(i) + 2) : xAt(i);
      labels += '<text x="' + x.toFixed(1) + '" y="' + (H - 8) + '" text-anchor="' + anchor + '" fill="rgba(255,255,255,0.62)" font-size="11" font-family="-apple-system,PingFang SC,sans-serif">' + lab + "</text>";
    });
    const yLabs = [tMin, Math.round((tMin + tMax) / 2), tMax].map((t) =>
      '<text x="' + (padL - 8) + '" y="' + (yT(t) + 4).toFixed(1) + '" text-anchor="end" fill="rgba(255,255,255,0.48)" font-size="11" font-family="-apple-system,sans-serif">' + t + "°</text>"
    ).join("");
    const maxI = temps.indexOf(Math.max.apply(null, temps));
    const minI = temps.indexOf(Math.min.apply(null, temps));
    const pin = (i, t) =>
      '<circle cx="' + xAt(i).toFixed(1) + '" cy="' + yT(t).toFixed(1) + '" r="3.2" fill="#fff" stroke="rgba(0,0,0,0.15)" stroke-width="0.6"/>' +
      '<text x="' + xAt(i).toFixed(1) + '" y="' + (yT(t) - 9).toFixed(1) + '" text-anchor="middle" fill="#fff" font-size="11" font-weight="600" font-family="-apple-system,sans-serif">' + round0(t) + "°</text>";
    el.innerHTML = '<svg viewBox="0 0 ' + W + " " + H + '" preserveAspectRatio="xMidYMid meet" role="img" aria-label="48小时气温与降雨趋势">' +
      '<defs><linearGradient id="tempFill" x1="0" y1="0" x2="0" y2="1">' +
      '<stop offset="0%" stop-color="#ffffff" stop-opacity="0.32"/><stop offset="100%" stop-color="#ffffff" stop-opacity="0"/></linearGradient></defs>' +
      yLabs + bars +
      '<path d="' + area + '" fill="url(#tempFill)" />' +
      '<path d="' + line + '" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/>' +
      pin(maxI, temps[maxI]) + (minI !== maxI ? pin(minI, temps[minI]) : "") +
      labels + "</svg>";
  }

  function iconGroup(name, x, y, s) {

  }

  function drawDailyChart(d) {
    const el = document.getElementById("daily-chart");
    if (!weather) { el.innerHTML = ""; return; }
    const todayIso = ymd(d);
    const days = weather.daily.time.map((date, i) => ({
      date,
      max: weather.daily.temperature_2m_max[i],
      min: weather.daily.temperature_2m_min[i],
      pop: weather.daily.precipitation_probability_max[i],
      code: weather.daily.weather_code[i],
      label: weekLabel(date, todayIso)
    }));
    const W = 420, H = 200;
    const padL = 10, padR = 10, padT = 28, padB = 40;
    const mins = days.map((x) => x.min), maxs = days.map((x) => x.max);
    const tMin = Math.floor(Math.min.apply(null, mins) - 1);
    const tMax = Math.ceil(Math.max.apply(null, maxs) + 1);
    const n = days.length;
    const xAt = (i) => padL + (i + 0.5) * ((W - padL - padR) / n);
    const yT = (t) => padT + (1 - (t - tMin) / (tMax - tMin || 1)) * (H - padT - padB);
    const hiPts = days.map((day, i) => [xAt(i), yT(day.max)]);
    const loPts = days.map((day, i) => [xAt(i), yT(day.min)]);
    const hi = smoothPath(hiPts, 0.2);
    const loRev = smoothPath(loPts.slice().reverse(), 0.2);
    const lastLo = loPts[loPts.length - 1];
    const band = hi + " L " + lastLo[0].toFixed(1) + "," + lastLo[1].toFixed(1) + " " + loRev.replace(/^M /, "C ").replace(/^C C /, "C ") + " Z";
    /* simpler band: high path then reverse low */
    const loBack = loPts.slice().reverse();
    let bandD = hi;
    bandD += " L " + loPts[loPts.length - 1][0].toFixed(1) + " " + loPts[loPts.length - 1][1].toFixed(1);
    const loPath = smoothPath(loBack, 0.2);
    bandD = hi + " L " + loPts[n - 1][0].toFixed(1) + "," + loPts[n - 1][1].toFixed(1);
    /* build closed shape from high then backward along low */
    let closed = hi;
    for (let i = n - 1; i >= 0; i--) {
      /* we'll just line to lows then use smooth of reversed */
    }
    closed = hi;
    const rPts = loPts.slice().reverse();
    /* continue with cubic by prepending last high already at loPts[n-1] after a line */
    closed += " " + smoothPath(rPts, 0.2).replace(/^M /, "L ") + " Z";

    let labels = "";
    days.forEach((day, i) => {
      const x = xAt(i);
      const y1 = yT(day.max), y2 = yT(day.min);
      labels += '<text x="' + x + '" y="' + (y1 - 10) + '" text-anchor="middle" fill="#fff" font-size="12" font-weight="600" font-family="-apple-system,sans-serif">' + round0(day.max) + "°</text>";
      labels += '<text x="' + x + '" y="' + (y2 + 16) + '" text-anchor="middle" fill="rgba(200,230,255,0.95)" font-size="12" font-family="-apple-system,sans-serif">' + round0(day.min) + "°</text>";
      const dark = false;
      labels += iconGroup(iconName(day.code, dark), x, H - 22, 16);
      labels += '<text x="' + x + '" y="' + (H - 4) + '" text-anchor="middle" fill="rgba(255,255,255,0.86)" font-size="11" font-family="-apple-system,PingFang SC,sans-serif">' + day.label + "</text>";
    });
    el.innerHTML = '<svg viewBox="0 0 ' + W + " " + H + '" preserveAspectRatio="xMidYMid meet" role="img" aria-label="七天高低温">' +
      '<defs><linearGradient id="dayBand" x1="0" y1="0" x2="0" y2="1">' +
      '<stop offset="0%" stop-color="#ffffff" stop-opacity="0.38"/><stop offset="100%" stop-color="#9fd4ff" stop-opacity="0.16"/></linearGradient></defs>' +
      '<path d="' + closed + '" fill="url(#dayBand)" />' +
      '<path d="' + hi + '" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>' +
      '<path d="' + smoothPath(loPts, 0.2) + '" fill="none" stroke="rgba(180,220,255,0.95)" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>' +
      days.map((day, i) =>
        '<circle cx="' + xAt(i) + '" cy="' + yT(day.max) + '" r="3" fill="#fff"/>' +
        '<circle cx="' + xAt(i) + '" cy="' + yT(day.min) + '" r="3" fill="rgb(180,220,255)"/>'
      ).join("") +
      labels + "</svg>";
  }

  function updateStamp() {
    const el = document.getElementById("updated");
    if (!fetchedAt) return;
    const t = fmtHM(new Date(fetchedAt));
    if (fromCache && cacheNote) {
      el.className = "stale";
      el.textContent = cacheNote + "（缓存 " + t + "）";
    } else {
      el.className = "";
      el.textContent = "更新于 " + t;
    }
  }

  function renderAll() {
    if (!weather) return;
    const d = nowDate();
    applySky(d);
    renderNow(d);
    renderOutfit(d);
    renderKidOutfit(d);
    renderTips(d);
    renderStrip(d);
    drawHourlyChart(d);
    drawDailyChart(d);
    updateStamp();
    document.body.classList.add("ready");
  }

  function saveCache() {
    try { localStorage.setItem(CACHE_KEY, JSON.stringify({ weather, air, fetchedAt })); } catch (e) {}
  }
  function loadCache() {
    try {
      const raw = localStorage.getItem(CACHE_KEY);
      if (!raw) return false;
      const o = JSON.parse(raw);
      if (!o || !o.weather) return false;
      weather = o.weather;
      air = o.air || null;
      fetchedAt = o.fetchedAt || 0;
      return true;
    } catch (e) { return false; }
  }

  async function loadWeather() {
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), 12000);
    try {
      const [wRes, aRes] = await Promise.all([
        fetch(WEATHER_URL, { signal: ctrl.signal }),
        fetch(AIR_URL, { signal: ctrl.signal }).catch(() => null)
      ]);
      clearTimeout(timer);
      if (!wRes || !wRes.ok) throw new Error("weather " + (wRes && wRes.status));
      const wJson = await wRes.json();
      if (!wJson.current || !wJson.hourly || !wJson.daily) throw new Error("bad weather shape");
      weather = wJson;
      air = null;
      if (aRes && aRes.ok) {
        try { air = await aRes.json(); } catch (e) { air = null; }
      }
      fetchedAt = Date.now();
      fromCache = false;
      cacheNote = "";
      saveCache();
      renderAll();
    } catch (err) {
      clearTimeout(timer);
      if (loadCache()) {
        fromCache = true;
        cacheNote = "网络异常，显示缓存";
        renderAll();
      } else {
        document.getElementById("updated").className = "stale";
        document.getElementById("updated").textContent = "天气获取失败，稍后重试";
      }
      console.warn("weather fetch failed", err);
    }
  }

  function speak(text) {
    if (!window.speechSynthesis) return;
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = "zh-CN";
    u.rate = 1.02;
    const pick = () => {
      const vs = window.speechSynthesis.getVoices() || [];
      const v = vs.find((x) => /zh-CN|zh_CN|Chinese\s*\(?China\)?|中文|普通话|汉语/.test((x.lang || "") + " " + (x.name || "")));
      if (v) u.voice = v;
    };
    pick();
    if (!u.voice) window.speechSynthesis.onvoiceschanged = () => { pick(); };
    window.speechSynthesis.speak(u);
  }
  function unlockSpeech() {
    if (!window.speechSynthesis) return;
    const u = new SpeechSynthesisUtterance(" ");
    u.lang = "zh-CN";
    u.volume = 0;
    window.speechSynthesis.speak(u);
    window.speechSynthesis.cancel();
  }

  function daySpeech(offset) {
    const today = ymd(nowDate());
    const iso = addDays(today, offset);
    const day = dailyAt(iso);
    if (!day) return "暂时没有这天的预报。";
    const names = ["今天", "明天", "后天"];
    const [desc] = wmo(day.code);
    let s = names[offset] + "苏州" + desc + "，最高气温" + round0(day.max) + "度，最低" + round0(day.min) + "度";
    s += "，降雨概率" + day.pop + "%";
    if (day.pop >= 40) s += "，建议带伞";
    else if (day.pop >= 20 || isRainCode(day.code)) s += "，可能会有短时降雨，可以备一把折叠伞";
    else s += "，基本不用带伞";
    return s + "。";
  }
  function currentSpeech() {
    const cur = weather.current;
    const [desc] = wmo(cur.weather_code);
    const today = dailyAt(ymd(nowDate()));
    let s = "苏州现在" + desc + "，气温" + round1(cur.temperature_2m) + "度，体感" + round1(cur.apparent_temperature) + "度";
    s += "，湿度" + round0(cur.relative_humidity_2m) + "%，风速" + round0(cur.wind_speed_10m) + "公里每小时";
    if (today) s += "。今天最高" + round0(today.max) + "度，最低" + round0(today.min) + "度";
    return s + "。";
  }
  function clothesSpeech() {
    const m = buildOutfitModel(nowDate());
    if (!m) return "暂时没有穿衣建议。";
    const o = m.outfit;
    let s = m.title + "建议如下。";
    s += (m.isCommuteDay ? "早晨通勤" : "早晨出门") + "气温大约" + round0(m.morningTemp) + "度，";
    s += "上衣" + o.morning.top + "，下装" + o.morning.bottom + "，鞋子" + o.morning.shoes;
    if (o.morning.acc) s += "，" + o.morning.acc;
    s += "。白天最高" + round0(m.dayTemp) + "度，上衣" + o.day.top + "。";
    return s;
  }
  function rainSpeech() {
    const f = focusDay(nowDate());
    const day = dailyAt(f.date);
    const cur = weather.current;
    const label = f.useTomorrow ? "明天" : "今天";
    if (cur && (cur.precipitation > 0 || isRainCode(cur.weather_code)))
      return "现在已经在下雨，出门请带伞。";
    if (!day) return "暂时没有降雨预报。";
    if (day.pop >= 40) return label + "降雨概率" + day.pop + "%，建议带伞。";
    if (day.pop >= 20 || isRainCode(day.code)) return label + "降雨概率" + day.pop + "%，" + wmo(day.code)[0] + "，建议备一把折叠伞。";
    return label + "降雨概率只有" + day.pop + "%，可以不带伞。";
  }
  function commuteSpeech() {
    const tom = addDays(ymd(nowDate()), 1);
    const [y, m, dd] = tom.split("-").map(Number);
    const wi = new Date(Date.UTC(y, m - 1, dd)).getUTCDay();
    if (wi === 0 || wi === 6) return "明天是周末，没有苏州到镇江的通勤安排。";
    const c = commuteWindow(tom);
    if (!c) return "暂时没有明早通勤时段的预报。";
    let s = "明早五点到八点，苏州气温大约" + round0(c.min) + "到" + round0(c.max) + "度";
    s += "，降雨概率" + c.pop + "%";
    if (c.rain || c.pop >= 40) s += "，路上可能下雨，高速注意湿滑";
    else if (c.fog) s += "，可能有雾，注意驾驶";
    else s += "，路况比较平稳";
    if (c.ice) s += "，低温注意结冰";
    return s + "。开车大约五点四十出发，车上比较暖，外套可以上车后再脱。";
  }
  function aqiSpeech() {
    if (!air || !air.current || air.current.us_aqi == null) return "暂时没有空气质量数据。";
    const a = aqiInfo(air.current.us_aqi);
    let s = "当前美国AQI指数" + round0(air.current.us_aqi) + "，空气质量" + a.label;
    if (air.current.pm2_5 != null) s += "，PM2.5为" + round1(air.current.pm2_5);
    if (air.current.us_aqi >= 101) s += "，建议出门戴口罩";
    else s += "，空气还可以";
    return s + "。";
  }
  function windSpeech() {
    const w = weather.current.wind_speed_10m;
    let s = "现在风速大约" + round0(w) + "公里每小时";
    if (w >= 25) s += "，风比较大，出门注意防风，穿防风外套更合适";
    else if (w >= 15) s += "，有些风，体感会更凉一些";
    else s += "，风不大";
    return s + "。";
  }
  function trendSpeech() {
    const today = ymd(nowDate());
    const parts = weather.daily.time.slice(0, 7).map((date, i) => {
      const lab = weekLabel(date, today);
      return lab + wmo(weather.daily.weather_code[i])[0] + "，" +
        round0(weather.daily.temperature_2m_min[i]) + "到" +
        round0(weather.daily.temperature_2m_max[i]) + "度";
    });
    return "未来七天趋势：" + parts.join("；") + "。";
  }
  function timeSpeech() {
    const d = nowDate();
    const p = tzParts(d, { hour: "2-digit", minute: "2-digit" });
    return "现在是苏州时间" + p.hour + "点" + p.minute + "分，" + gregDateText(d) + "，" + CN_WEEK[weekdayIndex(d)] + "，" + lunarText(d) + "。";
  }
  function fullSummary() {
    if (!weather) return "天气数据还没准备好，请稍后再试。";
    const tips = buildTips(nowDate()).map((t) => t.text).join("。");
    return timeSpeech() + currentSpeech() + clothesSpeech() + kidClothesSpeech() + tips;
  }

  function answerIntent(q) {
    if (!weather) return "天气数据还没准备好，请稍后再试。";
    const s = String(q || "").replace(/\s+/g, "");
    if (/通勤|明早|上班|高速|镇江/.test(s)) return commuteSpeech();
    if (/空气|雾霾|pm2|PM2|口罩|污染|aqi|AQI/.test(s)) return aqiSpeech();
    if (/儿子|睿航/.test(s)) return kidClothesSpeech();
    if (/穿什么|穿衣|衣服|穿搭|穿啥|怎么穿/.test(s)) return clothesSpeech();
    if (/趋势|未来几天|未来七天|一周|七天/.test(s)) return trendSpeech();
    if (/后天/.test(s)) return daySpeech(2);
    if (/明天/.test(s)) return daySpeech(1);
    if (/几点|现在几点|日期|几号|星期|农历|今天是/.test(s) && !/天气|气温|温度|下雨|最高|最低/.test(s))
      return timeSpeech();
    if (/下雨|带伞|降雨|雨伞|会不会下|要不要伞/.test(s)) return rainSpeech();
    if (/(风速|风大|有风|大风|刮风)/.test(s) || (/风/.test(s) && !/风衣/.test(s))) return windSpeech();
    if (/今天/.test(s)) return daySpeech(0);
    if (/现在|实时|当前|外面|温度|气温|天气/.test(s)) return currentSpeech();
    return currentSpeech();
  }

  function showQA(q, a) {
    const el = document.getElementById("transcript");
    el.innerHTML = (q ? '<div class="q">你说：' + escapeHtml(q) + "</div>" : "") +
      '<div class="a">回答：' + escapeHtml(a) + "</div>";
  }
  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  }

  let rec = null;
  let listening = false;
  function setupVoice() {
    const Rec = window.SpeechRecognition || window.webkitSpeechRecognition;
    const mic = document.getElementById("mic-btn");
    const talk = document.getElementById("talk-btn");
    const trans = document.getElementById("transcript");
    if (!Rec) {
      trans.innerHTML = '<span class="unsupported">此浏览器不支持语音识别。可使用「播报」。语音识别需在 HTTPS 或本地打开。</span>';
    } else {
      rec = new Rec();
      rec.lang = "zh-CN";
      rec.continuous = false;
      rec.interimResults = false;
      rec.maxAlternatives = 1;
      rec.onstart = () => { listening = true; mic.classList.add("listening"); };
      rec.onend = () => { listening = false; mic.classList.remove("listening"); };
      rec.onerror = (e) => {
        listening = false;
        mic.classList.remove("listening");
        const msg = e.error === "not-allowed"
          ? "没有麦克风权限，请在系统设置里允许 Safari 使用麦克风。"
          : (e.error === "no-speech" ? "没有听清，请再试一次。" : "语音识别出错：" + e.error);
        showQA("", msg);
      };
      rec.onresult = (ev) => {
        const text = ev.results[0][0].transcript;
        const ans = answerIntent(text);
        showQA(text, ans);
        speak(ans);
      };
    }
    mic.addEventListener("click", () => {
      unlockSpeech();
      if (!rec) {
        const a = weather ? answerIntent("现在天气") : "天气数据还没准备好。";
        showQA("（无语音识别）", a);
        speak(a);
        return;
      }
      if (listening) { try { rec.stop(); } catch (e) {} return; }
      try { rec.start(); } catch (e) { showQA("", "无法开始识别，请再点一次。"); }
    });
    talk.addEventListener("click", () => {
      const a = fullSummary();
      showQA("播报", a);
      speak(a);
    });
  }

  window.__desk = {
    answerIntent, buildOutfitModel, buildKidOutfitModel, buildTips, wmo, lunarText, focusDay, focusSchoolDay, nowDate, applySky, kidClothesSpeech,
    getState: () => ({ weather, air, fetchedAt, fromCache })
  };

  tick();
  setInterval(tick, 1000);
  setupVoice();
  if (loadCache()) {
    fromCache = false;
    cacheNote = "";
    renderAll();
  }
  loadWeather();
  setInterval(loadWeather, 15 * 60 * 1000);
  document.addEventListener("visibilitychange", () => {
    if (!document.hidden && Date.now() - fetchedAt > 15 * 60 * 1000) loadWeather();
  });
})();
</script>
</body>
</html>
